services:
  tsecret-bot:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      tsecret-postgres:
        condition: service_healthy
      tsecret-redis:
        condition: service_healthy
    volumes:
      - secret_files:/data/secrets
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  tsecret-worker:
    build:
      context: .
    command: ["sh", "-c", "python -m app.wait_for_schema && exec python -m app.worker_main"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      tsecret-postgres:
        condition: service_healthy
      tsecret-redis:
        condition: service_healthy
    volumes:
      - secret_files:/data/secrets
    networks:
      - internal

  tsecret-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tsecret
      POSTGRES_USER: tsecret
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsecret -d tsecret"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      internal:
        aliases: [postgres]

  tsecret-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      internal:
        aliases: [redis]

volumes:
  postgres_data:
  redis_data:
  secret_files:

networks:
  internal:
    internal: false
