<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="100%" stop-color="#10152b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="640" rx="20" fill="url(#card)"/>
  <rect x="0" y="0" width="1200" height="640" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="19.5" fill="none" stroke="#1f2740" stroke-width="1"/>

  <!-- title bar -->
  <path d="M20 0 L1180 0 A20 20 0 0 1 1200 20 L1200 52 L0 52 L0 20 A20 20 0 0 1 20 0 Z" fill="#0d1224"/>
  <circle cx="30" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="70" cy="26" r="6" fill="#28c840"/>
  <text x="600" y="31" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#6b7690">t-secret &#8212; @TheraSecret_bot</text>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#1c2338" stroke-width="1"/>

  <!-- headline -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="175" font-size="52" font-weight="700" fill="#f8fafc">T-<tspan fill="url(#accent)">Secret</tspan></text>
    <text x="600" y="216" font-size="20" fill="#aab4cc">Одноразовая передача текста, файлов и паролей в Telegram.</text>
    <text x="600" y="245" font-size="20" fill="#aab4cc">Секрет исчезает после прочтения — восстановить его невозможно.</text>
  </g>

  <!-- badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
    <g transform="translate(345,278)">
      <rect width="196" height="36" rx="18" fill="#141a30"/>
      <text x="98" y="23" text-anchor="middle" fill="#a5b4fc">Python 3.12 &#183; aiogram 3</text>
    </g>
    <g transform="translate(555,278)">
      <rect width="150" height="36" rx="18" fill="#141a30"/>
      <text x="75" y="23" text-anchor="middle" fill="#7dd3fc">AES-256-GCM</text>
    </g>
    <g transform="translate(719,278)">
      <rect width="196" height="36" rx="18" fill="#141a30"/>
      <circle cx="24" cy="18" r="4" fill="#4ade80"/>
      <text x="106" y="23" text-anchor="middle" fill="#86efac">необратимое удаление</text>
    </g>
  </g>

  <!-- feature grid -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="80" y1="345" x2="1120" y2="345" stroke="#1c2338" stroke-width="1"/>
    <line x1="340" y1="365" x2="340" y2="470" stroke="#1c2338" stroke-width="1"/>
    <line x1="600" y1="365" x2="600" y2="470" stroke="#1c2338" stroke-width="1"/>
    <line x1="860" y1="365" x2="860" y2="470" stroke="#1c2338" stroke-width="1"/>

    <!-- col 1: encryption -->
    <g transform="translate(100,375)">
      <path d="M6 18 v-6 a9 9 0 0 1 18 0 v6" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
      <rect x="2" y="16" width="26" height="20" rx="4" fill="#60a5fa"/>
      <text x="40" y="14" font-size="17" font-weight="600" fill="#e2e8f0">encryption</text>
      <text x="0" y="52" font-size="14" fill="#8b96b3">AES-256-GCM до записи</text>
      <text x="0" y="70" font-size="14" fill="#8b96b3">в PostgreSQL или на диск</text>
    </g>

    <!-- col 2: ttl_limits -->
    <g transform="translate(360,375)">
      <path d="M3 3 h20 M3 33 h20 M6 3 c0 10 14 10 14 15 c0 5 -14 5 -14 15 M20 3 c0 10 -14 10 -14 15 c0 5 14 5 14 15" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="14" font-size="17" font-weight="600" fill="#e2e8f0">ttl_limits</text>
      <text x="0" y="52" font-size="14" fill="#8b96b3">TTL, лимит просмотров,</text>
      <text x="0" y="70" font-size="14" fill="#8b96b3">экстренное удаление</text>
    </g>

    <!-- col 3: pin_lock -->
    <g transform="translate(620,375)">
      <circle cx="9" cy="9" r="8" fill="none" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="9" cy="9" r="3" fill="#a78bfa"/>
      <rect x="15" y="16" width="4" height="18" fill="#a78bfa"/>
      <rect x="15" y="20" width="10" height="4" fill="#a78bfa"/>
      <rect x="15" y="27" width="8" height="4" fill="#a78bfa"/>
      <text x="40" y="14" font-size="17" font-weight="600" fill="#e2e8f0">pin_lock</text>
      <text x="0" y="52" font-size="14" fill="#8b96b3">Argon2id PIN,</text>
      <text x="0" y="70" font-size="14" fill="#8b96b3">привязка получателя</text>
    </g>

    <!-- col 4: no_read_access -->
    <g transform="translate(880,375)">
      <path d="M2 15 C6 6 24 6 28 15 C24 24 6 24 2 15 Z" fill="none" stroke="#94a3b8" stroke-width="2.4"/>
      <circle cx="15" cy="15" r="4.5" fill="#94a3b8"/>
      <line x1="0" y1="26" x2="30" y2="4" stroke="#0d1224" stroke-width="4"/>
      <line x1="0" y1="26" x2="30" y2="4" stroke="#94a3b8" stroke-width="2"/>
      <text x="40" y="14" font-size="17" font-weight="600" fill="#e2e8f0">no_read_access</text>
      <text x="0" y="52" font-size="14" fill="#8b96b3">Админка не видит</text>
      <text x="0" y="70" font-size="14" fill="#8b96b3">содержимое секретов</text>
    </g>
  </g>

  <line x1="80" y1="505" x2="1120" y2="505" stroke="#1c2338" stroke-width="1"/>

  <!-- footer -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    <circle cx="85" cy="533" r="3" fill="#4ade80"/>
    <text x="96" y="538" fill="#9aa5c0">Одноразовое открытие</text>
    <circle cx="290" cy="533" r="3" fill="#4ade80"/>
    <text x="301" y="538" fill="#9aa5c0">Криптографическое удаление</text>
    <text x="1120" y="538" text-anchor="end" font-family="Consolas, Menlo, monospace" fill="#5c6785">MASTER_KEY отдельно от бэкапа</text>
  </g>
</svg>
