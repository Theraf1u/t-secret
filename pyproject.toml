[project]
name = "t-secret"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram[speedups]>=3.21,<4",
  "aiohttp-socks>=0.10,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "argon2-cffi>=25,<26",
  "cryptography>=45,<47",
  "pydantic-settings>=2.10,<3",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25,<26",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1,<2"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
